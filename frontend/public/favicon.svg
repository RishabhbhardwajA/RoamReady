  <!-- Carry-On Suitcase Body (Portrait Frame) -->
  <rect x="15.8" y="17.5" width="32.4" height="37.8" rx="5.2" fill="#0f1626" stroke="#e15a3a" stroke-width="3.2" stroke-linejoin="round" />

  <!-- Four Reinforced Corner Guard Arcs -->
  <path d="M17.4 23.4A4.6 4.6 0 0 0 21.8 19.1M42.2 19.1A4.6 4.6 0 0 0 46.6 23.4M17.4 49.4A4.6 4.6 0 0 1 21.8 53.7M42.2 53.7A4.6 4.6 0 0 1 46.6 49.4" fill="none" stroke="#e15a3a" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom Corner Feet / Wheels -->
