  <circle cx="32" cy="37.2" r="4.3" fill="#0f1626" />
  <polygon points="27.2,42.0 30.8,36.0 33.2,38.4" fill="#ffffff" />
  <polygon points="35.3,33.9 33.2,38.4 30.8,36.0" fill="#e15a3a" />
  <circle cx="32" cy="37.2" r="2.2" fill="#0f1626" />
  <circle cx="32" cy="37.2" r="1.2" fill="#ffffff" />
</svg>
