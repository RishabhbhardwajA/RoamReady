  <path d="M38.8 55.6H44.8V58.1C44.8 59.3 43.9 60 42.7 60H40.9C39.7 60 38.8 59.3 38.8 58.1Z" fill="#e15a3a" />

  <!-- Golden Route Ribbon & Compass Halo Ring -->
  <path d="M17.4 43.2 Q21.5 41.6 25.0 40.8 M38.8 33.4 L40.6 34.4 L46.6 32.8" fill="none" stroke="#dba344" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="32" cy="37.2" r="9.2" fill="none" stroke="#dba344" stroke-width="2.1" />

  <!-- 8-Point Compass Rose centered at (32, 37.2) -->
  <!-- Secondary Intercardinal Diagonal Spikes (Symmetrical Terracotta) -->
  <polygon points="32,37.2 36.2,37.2 39.7,29.5 32,33.0" fill="#e15a3a" />
  <polygon points="32,37.2 36.2,37.2 39.7,44.9 32,41.4" fill="#e15a3a" />
  <polygon points="32,37.2 32,41.4 24.3,44.9 27.8,37.2" fill="#e15a3a" />
  <polygon points="32,37.2 27.8,37.2 24.3,29.5 32,33.0" fill="#e15a3a" />

  <!-- Primary Cardinal Spikes (90-deg Rotational Crisp White & Terracotta Bevel) -->
  <polygon points="32,37.2 28.8,34.0 32,22.2" fill="#ffffff" />
  <polygon points="32,37.2 32,22.2 35.2,34.0" fill="#e15a3a" />
  <polygon points="32,37.2 35.2,34.0 46.8,37.2" fill="#ffffff" />
  <polygon points="32,37.2 46.8,37.2 35.2,40.4" fill="#e15a3a" />
  <polygon points="32,37.2 35.2,40.4 32,52.2" fill="#ffffff" />
  <polygon points="32,37.2 32,52.2 28.8,40.4" fill="#e15a3a" />
  <polygon points="32,37.2 28.8,40.4 17.2,37.2" fill="#ffffff" />
  <polygon points="32,37.2 17.2,37.2 28.8,34.0" fill="#e15a3a" />

