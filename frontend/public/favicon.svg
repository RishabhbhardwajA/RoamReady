<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deep Midnight Navy Badge -->
  <rect width="64" height="64" rx="14" fill="#0f1626" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- White Telescopic Handle Rods -->
  <rect x="24.5" y="8" width="3.2" height="9.5" fill="#ffffff" />
  <rect x="36.3" y="8" width="3.2" height="9.5" fill="#ffffff" />

  <!-- Terracotta Top Handle Grip (wrap-around caps) -->
  <path d="M22.2 6.6C22.2 4.8 23.6 3.8 25.4 3.8H38.6C40.4 3.8 41.8 4.8 41.8 6.6V8.6C41.8 9.2 41.3 9.6 40.6 9.6H36C35.5 9.6 35.1 9.2 35.1 8.6V8.2H28.9V8.6C28.9 9.2 28.5 9.6 28 9.6H23.4C22.7 9.6 22.2 9.2 22.2 8.6Z" fill="#e15a3a" />

